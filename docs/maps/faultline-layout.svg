<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">FAULTLINE 폐광 채석장 — 1차 평면 배치도</title>
  <desc id="desc">서쪽 블루와 동쪽 레드 스폰 사이를 북쪽 절벽길, 중앙 채굴 분지, 남쪽 굴착 터널이 연결한다. 거점 후보 A는 중앙, B는 북쪽 고지대, C는 남쪽에 있다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#e7b875"/></marker>
    <style>
      text { font-family: system-ui, sans-serif; fill: #d9e6e6; text-anchor: middle; }
      .small { font-size: 13px; fill: #a5bdc5; }
      .label { font-size: 17px; font-weight: 650; }
      .route { fill: none; stroke: #8aa3a6; stroke-width: 28; stroke-linecap: round; stroke-linejoin: round; }
      .ramp { fill: none; stroke: #e7b875; stroke-width: 4; marker-end: url(#arrow); }
      .rock { fill: #394b52; stroke: #9a9b83; stroke-width: 2; }
      .site { fill: #d9a95f; fill-opacity: .16; stroke: #f0c37f; stroke-width: 3; }
    </style>
  </defs>
