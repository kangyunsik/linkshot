  <path class="cover" d="M382 327 410 316 424 339 403 354 380 345Z"/>
  <path class="cover" d="M618 382 590 393 576 370 597 355 620 364Z"/>
  <circle cx="500" cy="354" r="39" class="site"/><text x="500" y="362" class="label" style="fill:#f6d8a6;font-size:26px">A</text>
  <circle cx="500" cy="170" r="29" class="site"/><text x="500" y="178" class="label" style="fill:#f6d8a6;font-size:23px">B</text>
  <circle cx="500" cy="538" r="29" class="site"/><text x="500" y="546" class="label" style="fill:#f6d8a6;font-size:23px">C</text>
  <text x="500" y="132" class="label">北 · 펌프 구역</text>
  <text x="500" y="282" class="label">중앙 배수판 · 0m</text>
  <text x="500" y="433" class="small">중앙 차폐 구조물 / 바닥 이동 가능</text>
  <text x="290" y="427" class="small">외곽 순환로</text><text x="710" y="427" class="small">+2.4m</text>
  <text x="500" y="604" class="small">南 · 정비 구역 / 아래쪽 앉기 통로 H 1.25m</text>
  <text x="870" y="145" class="small">N ↑</text>
  <path d="M65 653H112" stroke="#e7b875" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="199" y="659" class="small">높이 연결 경사로</text>
  <path d="M328 653H379" stroke="#83cfb9" stroke-width="8" stroke-dasharray="10 7"/>
  <text x="459" y="659" class="small">낮은 정비 우회로</text>
  <circle cx="599" cy="653" r="13" class="site"/><text x="709" y="659" class="small">A/B/C = 목표 위치 후보</text>
  <text x="500" y="696" class="small">시계 / 반시계 우회 · 중앙 낙하 후 경사로 복귀 · 미끄러짐/속도 변화 없음</text>
</svg>
