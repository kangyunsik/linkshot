<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">SUMP 원형 지하 저수조 — 1차 평면 배치도</title>
  <desc id="desc">서쪽과 동쪽 스폰에서 원형 순환로를 시계 및 반시계 방향으로 이동한다. 중앙의 낮은 배수판 A와 북쪽 펌프 구역 B, 남쪽 정비 구역 C가 거점 후보이며, 네 경사 연결과 남쪽의 앉기 우회 통로가 있다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#e7b875"/></marker>
    <style>
      text { font-family: system-ui, sans-serif; fill: #d9e6e6; text-anchor: middle; }
      .small { font-size: 13px; fill: #a5bdc5; }
      .label { font-size: 17px; font-weight: 650; }
      .ramp { fill: none; stroke: #e7b875; stroke-width: 5; marker-start: url(#arrow); marker-end: url(#arrow); }
      .cover { fill: #293e49; stroke: #9eb4b4; stroke-width: 2; }
      .site { fill: #d9a95f; fill-opacity: .16; stroke: #f0c37f; stroke-width: 3; }
    </style>
  </defs>
  <rect width="1000" height="720" fill="#101c26"/>
  <text x="40" y="48" style="text-anchor:start;font-size:30px;font-weight:750">SUMP / 원형 지하 저수조</text>
  <text x="40" y="78" class="small" style="text-anchor:start">DESIGN 01 · 약 68 × 68m · 최대 8인 · 실제 게임 구현 전 동선 설계</text>
  <rect x="40" y="108" width="920" height="510" rx="18" fill="#1b2a32" stroke="#435a65"/>
  <ellipse cx="500" cy="354" rx="250" ry="184" fill="none" stroke="#516a72" stroke-width="74"/>
  <ellipse cx="500" cy="354" rx="250" ry="184" fill="none" stroke="#9aafb0" stroke-width="2" stroke-dasharray="9 9"/>
  <ellipse cx="500" cy="354" rx="165" ry="111" fill="#25423f" stroke="#83a7a0" stroke-width="3"/>
  <path d="M187 354H250M750 354H813" stroke="#8aa3a6" stroke-width="32"/>
  <path class="ramp" d="M268 354H332M668 354H732M500 199V242M500 465V509"/>
  <path d="M292 478Q330 594 500 588Q670 594 708 478" fill="none" stroke="#83cfb9" stroke-width="10" stroke-linecap="round" stroke-dasharray="14 11"/>
