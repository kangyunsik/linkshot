  <path d="M920 301 847 289 799 323 799 386 851 412 920 397Z" fill="#65333c" stroke="#ff817a" stroke-width="3"/>
  <text x="134" y="345" class="label" style="fill:#a9d4ff">BLUE</text><text x="134" y="371" class="small">서쪽 진입부</text>
  <text x="866" y="345" class="label" style="fill:#ffb9b1">RED</text><text x="866" y="371" class="small">동쪽 진입부</text>
  <path class="cover" d="M333 222Q351 202 377 199L385 222Q364 225 351 240Z"/>
  <path class="cover" d="M667 222Q649 202 623 199L615 222Q636 225 649 240Z"/>
  <path class="cover" d="M272 300Q281 270 304 251L322 267Q304 288 298 308Z"/>
  <path class="cover" d="M728 300Q719 270 696 251L678 267Q696 288 702 308Z"/>
  <path class="cover" d="M322 467Q345 488 377 494L370 520Q337 510 306 487Z"/>
