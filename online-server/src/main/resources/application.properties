spring.application.name=linkshot-online
server.address=${ONLINE_BIND:127.0.0.1}
server.port=${ONLINE_PORT:8080}
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=LINKSHOTSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:lax}
server.tomcat.max-http-form-post-size=8KB
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/linkshot}
spring.datasource.username=${DATABASE_USER:linkshot}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.session.jdbc.initialize-schema=never
spring.jackson.deserialization.fail-on-unknown-properties=true
linkshot.engine-secret=${ENGINE_SECRET:}
linkshot.engine-public-url=${ENGINE_PUBLIC_URL:ws://127.0.0.1:8090/play}
linkshot.allowed-origins=${FRONTEND_ORIGINS:http://127.0.0.1:4173,http://localhost:4173,http://127.0.0.1:3000,http://localhost:3000}
linkshot.matchmaking.enabled=${MATCHMAKING_ENABLED:true}
linkshot.matchmaking.players=${MATCH_PLAYERS:4}
linkshot.matchmaking.casual-wait-seconds=${CASUAL_WAIT_SECONDS:30}
linkshot.matchmaking.frag-limit=${MATCH_FRAG_LIMIT:20}
linkshot.matchmaking.round-seconds=${MATCH_ROUND_SECONDS:300}
